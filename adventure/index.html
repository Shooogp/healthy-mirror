<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>مغامرة الأبطال في مملكة الغذاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Lalezar&display=swap">
<style>
/* Layout: one 16:9 storybook stage (1600×900) scaled to fit the board, parchment captions at the foot, seven-star strip at the head. */
:root{
  --night:#1a1140;
  --night-2:#2c1d63;
  --royal:#4b2a8c;
  --gold:#f3b631;
  --gold-deep:#b97a0c;
  --parch:#fff3d4;
  --parch-edge:#e9cf95;
  --ink:#2b1a0d;
  --leaf:#1f9a57;
  --ember:#e0572b;
  --white:#ffffff;
  --shadow:rgba(20,8,40,.45);
  --silver:#b9c3cf;
  --bronze:#c77c3c;
  --f-display:'Lalezar','Baloo Bhaijaan 2',Tahoma,'Segoe UI',sans-serif;
  --f-body:'Baloo Bhaijaan 2',Tahoma,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--white);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
#viewport{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 40%,var(--night-2),var(--night));touch-action:none;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;border-radius:14px;background:var(--night);box-shadow:0 20px 60px var(--shadow);direction:rtl}
#bg{position:absolute;inset:-3%;background-size:cover;background-position:center;transition:opacity .6s}
#bg.kb{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,-.8%)}}
#bg.dim{filter:brightness(.55) saturate(1.05)}
#scene{position:absolute;inset:0}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:5}
#flash{position:absolute;inset:0;background:var(--white);opacity:0;pointer-events:none;z-index:60;transition:opacity .35s}
#alarm{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,40,.55))}
#alarm.on{animation:alarm .7s ease-in-out infinite alternate}
@keyframes alarm{from{opacity:0}to{opacity:1}}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}

/* actors and props */
.actor{position:absolute;translate:-50% 0;transform-origin:50% 100%;filter:drop-shadow(0 16px 12px rgba(0,0,0,.35));transition:left .9s cubic-bezier(.3,.8,.3,1),bottom .9s cubic-bezier(.3,.8,.3,1),opacity .5s;z-index:10}
.actor.flip{rotate:y 180deg}
.actor.talk{animation:talk .42s ease-in-out infinite alternate}
@keyframes talk{from{scale:1 1}to{scale:1.018 .985}}
.actor.sleepy{animation:sleepy 2.6s ease-in-out infinite;filter:drop-shadow(0 16px 12px rgba(0,0,0,.35)) saturate(.7)}
@keyframes sleepy{0%,100%{rotate:-2deg}50%{rotate:3deg}}
.actor.hop{animation:hop .55s ease-in-out 3}
@keyframes hop{0%,100%{translate:-50% 0}50%{translate:-50% -46px}}
.actor.walk{animation:walk .45s ease-in-out infinite}
@keyframes walk{0%,100%{translate:-50% 0;rotate:-2deg}50%{translate:-50% -14px;rotate:2deg}}
.actor.tired{animation:tired 1.6s ease-in-out infinite}
@keyframes tired{0%,100%{scale:1 1}50%{scale:1.01 .97}}
.actor.glow{filter:drop-shadow(0 0 26px rgba(255,214,90,.95)) drop-shadow(0 16px 12px rgba(0,0,0,.3))}
.prop{position:absolute;translate:-50% -50%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.32));transition:left .8s cubic-bezier(.3,.8,.3,1),top .8s cubic-bezier(.3,.8,.3,1),width .6s,opacity .5s,scale .5s;z-index:12}
.prop.float{animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{translate:-50% -50%}50%{translate:-50% calc(-50% - 16px)}}
.prop.glowing{filter:drop-shadow(0 0 30px rgba(255,220,110,1)) drop-shadow(0 0 60px rgba(255,200,60,.7))}
.prop.shake{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{rotate:0deg}20%{rotate:-8deg}40%{rotate:7deg}60%{rotate:-5deg}80%{rotate:4deg}}
.prop.spin{animation:spin .25s linear infinite}
@keyframes spin{0%{rotate:-4deg}50%{rotate:4deg}100%{rotate:-4deg}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{scale:0}to{scale:1}}

/* draggable items */
.item{position:absolute;translate:-50% -50%;cursor:grab;z-index:20;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));transition:scale .15s,filter .15s;touch-action:none}
.item img{width:100%;height:100%;object-fit:contain;display:block}
.item.home{transition:left .45s cubic-bezier(.3,1.3,.5,1),top .45s cubic-bezier(.3,1.3,.5,1),width .4s,height .4s,scale .15s}
.item.dragging{scale:1.16;z-index:50;cursor:grabbing;filter:drop-shadow(0 22px 16px rgba(0,0,0,.45))}
.item.placed{cursor:default;pointer-events:none;transition:left .4s,top .4s,width .4s,height .4s}
.item.tap{cursor:pointer}
.item.wrong{animation:shake .45s}
.item.bye{transition:left .7s ease-in,top .7s ease-in,opacity .7s,rotate .7s;opacity:0;rotate:200deg;pointer-events:none}
.target{position:absolute;translate:-50% -50%;z-index:15;transition:filter .2s,scale .2s}
.target img{width:100%;display:block}
.target.hot{filter:drop-shadow(0 0 22px rgba(255,236,140,1));scale:1.05}
.target.done{filter:drop-shadow(0 0 26px rgba(80,230,140,.95))}
.tag{position:absolute;translate:-50% 0;font-family:var(--f-display);font-size:34px;padding:6px 26px 2px;border-radius:999px;color:var(--white);white-space:nowrap;z-index:16;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tag.green{background:var(--leaf)}
.tag.orange{background:var(--ember)}
.tag.purple{background:var(--royal)}
.check{position:absolute;translate:-50% -50%;width:84px;height:84px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;z-index:30;box-shadow:0 0 0 6px var(--white),0 8px 16px rgba(0,0,0,.3)}
.check svg{width:52px;height:52px}
.medal{position:absolute;translate:-50% -50%;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:54px;line-height:1;padding-top:8px;color:var(--ink);z-index:31;box-shadow:0 0 0 6px var(--white),0 10px 18px rgba(0,0,0,.35)}
.medal.r1{background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold))}
.medal.r2{background:radial-gradient(circle at 35% 30%,#ffffff,var(--silver))}
.medal.r3{background:radial-gradient(circle at 35% 30%,#ffd9b3,var(--bronze))}
.counter{position:absolute;translate:-50% 0;z-index:30;display:flex;gap:10px}
.counter i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid var(--white);display:block}
.counter i.on{background:var(--gold);border-color:var(--gold-deep)}

/* chrome: hud, teacher bar, caption, cta */
#hud{position:absolute;top:16px;left:50%;translate:-50% 0;display:flex;gap:8px;padding:8px 18px;background:rgba(26,17,64,.55);border:2px solid rgba(243,182,49,.6);border-radius:999px;z-index:40;backdrop-filter:blur(6px)}
#hud .slot{width:56px;height:56px;position:relative;display:grid;place-items:center}
#hud .slot img{width:52px;opacity:.22;filter:grayscale(1) brightness(1.6);transition:opacity .4s,filter .4s,scale .4s}
#hud .slot.on img{opacity:1;filter:none;scale:1.08}
#hud .slot .flag{position:absolute;width:24px;height:16px;bottom:10px;opacity:0;transition:opacity .4s}
#hud .slot.on .flag{opacity:1}
#tbar{position:absolute;top:16px;left:16px;display:flex;gap:10px;z-index:45}
.tb{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(26,17,64,.6);color:var(--white);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s,scale .15s}
.tb:hover{background:rgba(75,42,140,.85)}
.tb:active{scale:.92}
.tb:focus-visible,.cta:focus-visible,.med:focus-visible,.opt:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.tb svg{width:30px;height:30px}
.tb.off{opacity:.55}
#caption{pointer-events:none;position:absolute;bottom:18px;left:50%;translate:-50% 0;width:1180px;min-height:118px;display:flex;align-items:center;gap:22px;padding:14px 30px 14px 24px;background:var(--parch);color:var(--ink);border:4px solid var(--parch-edge);border-radius:30px;box-shadow:0 10px 0 rgba(0,0,0,.18),0 18px 40px var(--shadow);z-index:42;opacity:0;translate:-50% 30px;transition:opacity .3s,translate .3s}
#caption.show{opacity:1;translate:-50% 0}
#caption .av{flex:0 0 auto;width:92px;height:92px;border-radius:50%;overflow:hidden;background:var(--gold);border:4px solid var(--gold-deep)}
#caption .av img{width:100%;height:150%;object-fit:cover;object-position:50% 4%}
#caption .av.narr{background:var(--royal);display:grid;place-items:center}
#caption .who{font-family:var(--f-display);font-size:28px;color:var(--royal);line-height:1.1}
#caption .txt{font-size:36px;font-weight:700;line-height:1.35;text-wrap:balance}
.cta{position:absolute;left:50%;bottom:170px;translate:-50% 0;z-index:44;font-family:var(--f-display);font-size:50px;color:var(--ink);background:linear-gradient(180deg,#ffd76a,var(--gold));border:none;border-radius:999px;padding:16px 64px 8px;box-shadow:0 10px 0 var(--gold-deep),0 18px 30px var(--shadow);cursor:pointer;animation:breathe 1.6s ease-in-out infinite}
.cta:active{translate:-50% 6px;box-shadow:0 4px 0 var(--gold-deep)}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.05}}
.card{position:absolute;left:50%;top:120px;translate:-50% 0;width:1080px;padding:26px 40px 30px;background:var(--parch);color:var(--ink);border:4px solid var(--parch-edge);border-radius:28px;z-index:43;box-shadow:0 18px 40px var(--shadow)}
.card .lbl{font-family:var(--f-display);font-size:28px;color:var(--white);background:var(--royal);display:inline-block;padding:4px 22px 0;border-radius:999px}
.card h3{margin:14px 0 6px;font-family:var(--f-body);font-weight:800;font-size:44px;line-height:1.3;text-wrap:balance}
.card p{margin:0;font-size:30px;line-height:1.4;color:#5a4330}

/* title and map */
.title{position:absolute;left:50%;top:150px;translate:-50% 0;text-align:center;z-index:30;width:1300px}
.title .kick{font-family:var(--f-body);font-weight:700;font-size:34px;color:var(--gold);letter-spacing:.5px}
.title h1{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:112px;line-height:1.05;color:var(--white);text-shadow:0 6px 0 var(--royal),0 14px 30px rgba(0,0,0,.5);text-wrap:balance}
.title .sub{margin-top:14px;font-size:32px;color:var(--parch)}
.med{position:absolute;translate:-50% -50%;width:176px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;z-index:30;background:none;border:none;padding:0;color:inherit;font:inherit}
.med .ring{width:150px;height:150px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#fff6dc,#f0c46a);border:7px solid var(--gold);box-shadow:0 8px 0 var(--gold-deep),0 14px 26px var(--shadow);position:relative;transition:scale .2s}
.med .ring img{position:absolute;left:50%;top:6%;translate:-50% 0;height:210%;width:auto}
.med .num{position:absolute;top:-6px;right:-6px;width:50px;height:50px;border-radius:50%;background:var(--royal);color:var(--white);font-family:var(--f-display);font-size:30px;display:grid;place-items:center;border:3px solid var(--white);z-index:2}
.med .name{font-family:var(--f-display);font-size:26px;line-height:1.1;background:var(--parch);color:var(--ink);padding:5px 16px 1px;border-radius:999px;border:3px solid var(--parch-edge);white-space:nowrap}
.med.next .ring{animation:nextglow 1.2s ease-in-out infinite alternate}
@keyframes nextglow{from{box-shadow:0 8px 0 var(--gold-deep),0 0 0 0 rgba(255,215,90,.0)}to{box-shadow:0 8px 0 var(--gold-deep),0 0 0 18px rgba(255,215,90,.45)}}
.med.done .ring{filter:saturate(.75)}
.med .badge{position:absolute;bottom:34px;left:6px;width:62px;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.med:active .ring{scale:.94}
.med.final .ring{background:radial-gradient(circle,#ffe9a8,#e0a325)}
.med.onmap{width:150px}
.med.onmap .ring{width:124px;height:124px;border-width:6px}
.med.onmap .num{position:absolute;top:-16px;right:-6px;width:62px;height:62px;font-size:40px;padding-top:6px;background:var(--ember);border:4px solid var(--white);box-shadow:0 6px 12px var(--shadow);z-index:4}
.med.onmap .name{font-size:23px}
.med.onmap .badge{bottom:30px;left:-4px;width:54px}
.med.final .ring img{height:84%;top:10%}
.med .ring img.f-nakhla{translate:-30% 0}
#caption .av img.f-nakhla{object-position:30% 4%}
.med.locked{opacity:.55}

/* quiz */
.opts{position:absolute;left:50%;top:420px;translate:-50% 0;display:flex;gap:36px;z-index:43}
.opt{width:330px;min-height:300px;background:var(--parch);border:5px solid var(--parch-edge);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.2);color:var(--ink);font:inherit;transition:scale .15s}
.opt:active{scale:.96}
.opt .pics{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:170px}
.opt .pics img{max-height:170px;max-width:150px;object-fit:contain}
.opt .pics.three img{max-width:96px;max-height:120px}
.opt .ot{font-size:30px;font-weight:800;line-height:1.25;text-align:center}
.opt.right{border-color:var(--leaf);box-shadow:0 0 0 8px rgba(31,154,87,.5)}
.opt.no{animation:shake .45s}
.banner{position:absolute;left:50%;top:120px;translate:-50% 0;z-index:46;text-align:center;width:1400px}
.banner h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:96px;line-height:1.1;color:var(--gold);text-shadow:0 6px 0 var(--royal),0 16px 30px rgba(0,0,0,.55)}
.banner p{margin:10px auto 0;font-size:40px;font-weight:800;color:var(--white);text-shadow:0 3px 10px rgba(0,0,0,.6);text-wrap:balance}
.note{position:absolute;left:24px;bottom:150px;z-index:41;background:rgba(26,17,64,.72);color:var(--parch);border-radius:18px;padding:10px 18px;font-size:22px;max-width:360px;line-height:1.35;border:2px solid rgba(243,182,49,.5)}
/* prior learning: lost animals */
#hud{transition:opacity .4s}
#stage.pre #hud{opacity:0;pointer-events:none}
#stage.pre #bg{filter:brightness(.5) blur(3px)}
.pl-head{position:absolute;top:20px;left:50%;translate:-50% 0;display:flex;align-items:center;gap:18px;z-index:30;white-space:nowrap}
.pl-head .kick{font-family:var(--f-display);font-size:30px;background:var(--ember);color:var(--white);padding:7px 24px 1px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.pl-head h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:70px;line-height:1;color:var(--white);text-shadow:0 5px 0 var(--royal),0 12px 26px rgba(0,0,0,.5)}
.pl-timer{position:absolute;top:12px;right:20px;width:118px;height:118px;z-index:30;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;padding:0;color:var(--white);font:inherit}
.pl-timer svg{position:absolute;inset:0;rotate:-90deg}
.pl-timer .tr{fill:rgba(26,17,64,.78);stroke:rgba(255,255,255,.22);stroke-width:10}
.pl-timer .tp{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.pl-timer b{position:relative;font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;padding-top:8px;direction:ltr}
.pl-timer small{position:relative;font-size:17px;font-weight:700;color:var(--parch);line-height:1}
.pl-timer.paused{opacity:.6}
.pl-timer.end .tp{stroke:var(--ember)}
.pl-timer.end{animation:breathe 1s ease-in-out infinite}
.hab{position:absolute;top:124px;width:460px;height:430px;translate:-50% 0;border-radius:34px;background-size:cover;background-position:center;border:7px solid var(--parch);box-shadow:0 10px 0 rgba(0,0,0,.22),0 20px 40px var(--shadow);z-index:8;transition:scale .2s,box-shadow .25s,border-color .25s}
.hab .nm{position:absolute;left:50%;bottom:-27px;translate:-50% 0;font-family:var(--f-display);font-size:40px;line-height:1.2;padding:6px 36px 0;border-radius:999px;color:var(--white);border:4px solid var(--parch);box-shadow:0 6px 0 rgba(0,0,0,.25);white-space:nowrap}
.hab.desert .nm{background:#d4801a}
.hab.sea .nm{background:#1b86c9}
.hab.forest .nm{background:var(--leaf)}
.hab.hot{scale:1.03;border-color:#ffe27a;box-shadow:0 0 0 9px rgba(255,226,122,.6),0 20px 40px var(--shadow)}
.hab.done{border-color:#8ff0b6;box-shadow:0 0 0 9px rgba(80,230,140,.55),0 20px 40px var(--shadow)}
.hab.no{border-color:#ff7a6b;animation:habno .45s}
@keyframes habno{0%,100%{rotate:0deg}25%{rotate:-1.3deg}75%{rotate:1.3deg}}
.pl-tray{position:absolute;left:50%;bottom:20px;translate:-50% 0;width:1440px;height:250px;border-radius:40px;background:rgba(26,17,64,.55);border:3px dashed rgba(243,182,49,.7);z-index:6;transition:opacity .5s}
.pl-tray .lbl{position:absolute;top:-24px;left:974px;translate:-50% 0;font-family:var(--f-display);font-size:30px;background:var(--royal);color:var(--white);padding:6px 24px 0;border-radius:999px;border:3px solid rgba(243,182,49,.8)}
.item .qm{position:absolute;top:-10px;right:0;width:56px;height:56px;border-radius:50%;background:var(--white);color:var(--royal);font-family:var(--f-display);font-size:40px;line-height:1;display:grid;place-items:center;padding-top:8px;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:qm 1.4s ease-in-out infinite}
@keyframes qm{0%,100%{translate:0 0}50%{translate:0 -8px}}
.item.lost img{transform-origin:50% 100%;animation:lost 2.4s ease-in-out infinite}
@keyframes lost{0%,100%{rotate:-3deg}50%{rotate:3deg}}
.item.placed.swim img{animation:swim 3.4s ease-in-out infinite}
@keyframes swim{0%,100%{translate:18px 0;rotate:-3deg}50%{translate:-18px -10px;rotate:3deg}}
.item.placed.happy img{transform-origin:50% 100%;animation:happy .5s ease-in-out 3,bob 2.6s ease-in-out 1.5s infinite}
@keyframes happy{0%,100%{translate:0 0}50%{translate:0 -40px}}
@keyframes bob{0%,100%{scale:1 1}50%{scale:1.02 .98}}
.card.low{top:auto;bottom:100px;padding:20px 40px 22px}
.card.low h3{margin:10px 0 2px;font-size:42px}
.card .qrow{display:flex;align-items:center;justify-content:space-between;gap:20px}
.card .reveal{font-family:var(--f-display);font-size:28px;line-height:1.2;background:var(--leaf);color:var(--white);border:none;border-radius:999px;padding:6px 26px 0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.card .reveal:active{translate:0 3px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.card .ans{display:none;color:#17713f;font-weight:800}
.card.open .ans{display:block}
#stage.pre .cta{bottom:14px;font-size:40px;padding:11px 54px 5px}
#stage.lowcta .cta{bottom:22px}
/* station 6: the healthy-food mirror */
.mr-panel{position:absolute;left:50%;top:250px;translate:-50% 0;width:900px;box-sizing:border-box;padding:24px 44px 34px;background:var(--parch);color:var(--ink);border:5px solid var(--parch-edge);border-radius:30px;z-index:30;text-align:center;box-shadow:0 18px 40px var(--shadow)}
.mr-panel img{width:190px;margin:-130px auto 4px;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.mr-panel h3{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:46px;line-height:1.2;color:var(--royal)}
.mr-panel p{margin:0 0 20px;font-size:30px;font-weight:700;line-height:1.45;text-wrap:balance}
.mr-again{font-family:var(--f-display);font-size:30px;line-height:1.2;background:var(--royal);color:var(--white);border:none;border-radius:999px;padding:10px 34px 4px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.mr-again input{display:none}
label.mr-again{display:inline-block}
.mr-again:active{translate:0 3px;box-shadow:0 3px 0 rgba(0,0,0,.25)}

/* ---------- stage scaling ---------- */
const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
let SCALE = 1, OX = 0, OY = 0;
function fit(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  SCALE = Math.min(w/1600, h/900);
  OX = (w - 1600*SCALE)/2; OY = (h - 900*SCALE)/2;
  stage.style.transform = `translate(${OX}px,${OY}px) scale(${SCALE})`;
}
addEventListener('resize', fit); fit();
function toStage(cx, cy){ const r = stage.getBoundingClientRect(); return {x:(cx-r.left)/SCALE, y:(cy-r.top)/SCALE}; }
function rectOf(el, pad=0){ const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return {x:(r.left-s.left)/SCALE - pad, y:(r.top-s.top)/SCALE - pad, w:r.width/SCALE + 2*pad, h:r.height/SCALE + 2*pad}; }
const inR = (p,r) => p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;

const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
function ctx(id){
  const g = v => { if (id !== RUN) throw CANCEL; return v; };
  return {
    id, g,
    sleep: async ms => g(await new Promise(r => later(r, ms))),
    say: async (lid, opt) => g(await say(lid, opt)),
    sayAll: async (...ids) => { for (const l of ids) g(await say(l)); },
    cta: async (label) => g(await cta(label)),
    wait: async p => g(await p),
  };
}

      if (GAME_MODE) later(() => { if (lastLine === id && !curResolve) hideCaption(); }, 1600);
      res(); };

    const a = audioFor(id); curAudio = a;
    try { a.currentTime = 0; } catch(e){}

    a.onended = fin;
    a.onerror = () => later(fin, est(L[1]));

/* ---------- drag engine ---------- */
function makeItem(n, x, y, w, data = {}){
  const it = el('div', 'item home'); it.innerHTML = `<img src="${IMG.i(n)}" alt="">`;
  it.style.left = x + 'px'; it.style.top = y + 'px'; it.style.width = w + 'px'; it.style.height = w + 'px';
  it.dataset.k = n; Object.assign(it, {home:{x, y, w}, data});
  sceneEl.appendChild(it); return it;
}
function draggable(it, {targets, onDrop, clone = false}){
  it.addEventListener('pointerdown', e => {
    if (it.classList.contains('placed')) return;
    e.preventDefault(); ac();
    let d = it;
    if (clone){ d = makeItem(it.dataset.k, it.home.x, it.home.y, it.home.w, it.data); d.home = it.home; }
    d.classList.remove('home'); d.classList.add('dragging');
    const p0 = toStage(e.clientX, e.clientY);
    const off = {x: parseFloat(d.style.left) - p0.x, y: parseFloat(d.style.top) - p0.y};
    try { it.setPointerCapture(e.pointerId); } catch(_){}
    sfx.pop();
    const move = ev => { const p = toStage(ev.clientX, ev.clientY); d.style.left = (p.x + off.x) + 'px'; d.style.top = (p.y + off.y) + 'px';
      targets().forEach(t => t.el.classList.toggle('hot', inR(p, rectOf(t.el, 30)))); };
    const up = ev => {
      it.removeEventListener('pointermove', move); it.removeEventListener('pointerup', up); it.removeEventListener('pointercancel', up);
      d.classList.remove('dragging');
      const p = toStage(ev.clientX, ev.clientY);
      const hit = targets().find(t => inR(p, rectOf(t.el, 30)));
      targets().forEach(t => t.el.classList.remove('hot'));
      const r = hit ? onDrop(d, hit, p) : false;
      if (r !== true){
        if (clone){ d.classList.add('home'); d.style.left = d.home.x + 'px'; d.style.top = d.home.y + 'px'; later(() => d.remove(), 460); }
        else { d.classList.add('home'); d.style.left = d.home.x + 'px'; d.style.top = d.home.y + 'px'; }
      }
    };
    it.addEventListener('pointermove', move); it.addEventListener('pointerup', up); it.addEventListener('pointercancel', up);
  });
}

let parts = [], fxOn = false;
function confetti(n = 160){ const cols = ['#f3b631','#1f9a57','#e0572b','#ffffff','#7c4ddb','#3cb4e6'];
  for (let i=0;i<n;i++) parts.push({x:800 + (Math.random()-.5)*600, y:380 + (Math.random()-.5)*120, vx:(Math.random()-.5)*18, vy:-Math.random()*18-6, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, s:8+Math.random()*10, c:cols[i%cols.length], life:160+Math.random()*80});
  if (!fxOn){ fxOn = true; requestAnimationFrame(tick); } }
function tick(){ fxc.clearRect(0,0,1600,900); parts = parts.filter(p => p.life-- > 0 && p.y < 950);
  for (const p of parts){ p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; fxc.save(); fxc.translate(p.x,p.y); fxc.rotate(p.r); fxc.fillStyle = p.c; fxc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); fxc.restore(); }
  if (parts.length) requestAnimationFrame(tick); else { fxOn = false; fxc.clearRect(0,0,1600,900); } }

const arNum = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function plTimer(root, total){
  const ms = total * 1000; let left = ms, last = performance.now(), run = true, ended = false;
  const b = root.querySelector('b'), tp = root.querySelector('.tp'), C = 2 * Math.PI * 52;
  tp.style.strokeDasharray = C;
  const draw = () => { const s = Math.ceil(left / 1000); b.textContent = arNum(Math.floor(s / 60)) + ':' + arNum(String(s % 60).padStart(2, '0')); tp.style.strokeDashoffset = C * (1 - left / ms); };
  const step = () => { const now = performance.now(); if (run) left = Math.max(0, left - (now - last)); last = now; draw();
    if (left <= 0 && !ended){ ended = true; root.classList.add('end'); sfx.ding(); later(() => sfx.ding(), 450); return; }
    later(step, 250); };
  root.addEventListener('click', () => { ac(); if (ended) return; run = !run; root.classList.toggle('paused', !run); });
  step();
}

/* --- generic station frame --- */
let NEXT_PHASE = 'teaser';
async function stationFrame(c, key, {teaser, game, win, ask, next, go}){
  const phase = NEXT_PHASE; NEXT_PHASE = 'teaser';
  if (phase !== 'game'){
    mark(key + ':teaser', () => STATIONS[key]('teaser'));
    const v = playVideo(c, key);
    let usedVideo = false;
    if (v) usedVideo = await c.wait(v);
    if (!usedVideo) await teaser();
    await c.cta(go || 'هيا نساعد!');
    dropVideo();
  }
  mark(key + ':game', () => STATIONS[key]('game'));
  GAME_MODE = true;
  try { await game(); } finally { GAME_MODE = false; }
  await win();
  if (ask){ const k = card('سؤال للمعلّمة', ask[0], ask[1]); await c.cta('التالي'); k.remove(); }
  await awardStar(c, +key[1]);
  DONE.add(key);
  if (next) await next();
  await c.sleep(400);
  map();
}

function setTok(tok, [x, y]){ tok.style.left = (MZ.x + x) + 'px'; tok.style.top = (MZ.y + y) + 'px'; }
function mzWalk(tok, pts, speed = 430){
  const id = RUN;
  return new Promise(res => {
    let i = 0;
    const seg = () => {
      if (id !== RUN || i >= pts.length - 1) return res();
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const T = Math.max(140, Math.hypot(x1 - x0, y1 - y0) / speed * 1000), t0 = performance.now();
      const step = now => {
        if (id !== RUN) return res();
        const k = Math.min(1, (now - t0) / T);
        setTok(tok, [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k]);
        if (k < 1) requestAnimationFrame(step); else { i++; seg(); }
      };
      requestAnimationFrame(step);
    };
    seg();
  });
}

  {line:'s9_m1', t:'ابحث واكتشف', ic:'search', c:'#1b86c9', d:'ابحث في مطبخ منزلك بمساعدة أحد أفراد أسرتك عن ثلاثة أطعمة تعتقد أنها صحية، وطعام واحد ينبغي التقليل منه.'},
  {line:'s9_m2', t:'فكّر واستنتج', ic:'bulb', c:'#e39a12', d:'اسأل نفسك: لماذا اخترت هذه الأطعمة؟ وما الذي يجعل بعضها أفضل لصحة جسمي؟'},
  {line:'s9_m3', t:'التقط الدليل', ic:'camera', c:'#e0572b', d:'ارسم الأطعمة التي اكتشفتها، أو التقط لها صورة بمساعدة أسرتك.'},
  {line:'s9_m4', t:'قرار المحقق', ic:'check', c:'#1f9a57', d:'اختر غذاءً صحيًا تريد إضافته إلى وجبتك المدرسية غدًا.'},
];
const MS_ORD = ['المهمة الأولى', 'المهمة الثانية', 'المهمة الثالثة', 'المهمة الرابعة'];
function s9(){
  scene(async c => {
    preload(['s9_a','s9_b','s9_g','s9_m1','s9_m2','s9_m3','s9_m4','s9_c','s9_w']);
    await stationFrame(c, 's9', {
      go: 'افتحوا الرسائل السرية!',
      teaser: async () => {
        setBg('bg_kitchen');
        const env = prop('envelope', {x:640, y:430, w:20, cls:'glowing'});
        actor('detective', {x:1250, bottom:40, h:600, enter:'right'});
        await c.sleep(900); sfx.sparkle(); env.style.width = '320px';
        await c.sleep(600); env.classList.add('float');
        await c.say('s9_a'); await c.say('s9_b');
      },
      game: async () => {
        clearScene(); setBg('bg_kitchen', {kb:false, dim:true});
        stage.classList.add('lowcta');
        actor('detective', {x:1480, bottom:30, h:440});
        tag('مهمة المحقق الصغير · ١٠ دقائق في المنزل', 'purple', 700, 100);
        const xs = [1185, 865, 545, 225];
        const cards = MISSIONS.map((m, i) => {
          const b = el('button', 'ms' + (i ? ' locked' : ' next'));
          b.type = 'button'; b.style.left = xs[i] + 'px'; b.style.setProperty('--c', m.c);
          b.setAttribute('aria-label', MS_ORD[i]);
          b.innerHTML = `<div class="env"><img src="${IMG.i('envelope')}" alt=""><span class="n">${arNum(i + 1)}</span></div>
            <div class="open"><div class="ic">${MS_ICONS[m.ic]}</div><div class="mt">${MS_ORD[i]}</div><h4>${m.t}</h4><p>${m.d}</p></div>`;
          sceneEl.appendChild(b); return b;
        });
        say('s9_g');
        for (let i = 0; i < cards.length; i++){
          await c.wait(new Promise(r => cards[i].addEventListener('click', () => { ac(); r(); }, {once:true})));
          cards[i].classList.remove('next'); cards[i].classList.add('opened'); flash(); sfx.page();
          if (cards[i + 1]){ cards[i + 1].classList.remove('locked'); cards[i + 1].classList.add('next'); }
          await c.say(MISSIONS[i].line);
        }
        await c.sleep(500);
        cards.forEach(b => b.style.opacity = .15);
        const dc = el('div', 'dcard pop', `
          <div class="hd"><span class="mg">${MS_ICONS.search}</span><div><h3>بطاقة المحقق الصغير</h3><p>اكتشافاتي في مطبخ منزلي</p></div><span class="stamp">سرّي</span></div>
          <div class="fl">
            <div class="f"><b>أطعمة صحية اكتشفتها:</b><div class="ln">١</div><div class="ln">٢</div><div class="ln">٣</div></div>
            <div class="f"><b>طعام ينبغي أن أقلل منه:</b><div class="ln"></div></div>
            <div class="f"><b>غذاء سأضيفه إلى حقيبتي المدرسية:</b><div class="ln"></div></div>
          </div>
          <div class="ev">${MS_ICONS.camera.replace(/#fff/g, '#b49766')}<span>الدليل:<br>رسم أو صورة لما اكتشفته</span></div>`);
        sceneEl.appendChild(dc);
        sfx.sparkle();
        await c.say('s9_c');
        await c.cta('قبلنا المهمة!');
        dc.remove(); cards.forEach(b => b.style.opacity = 1);
      },
      win: async () => {
        ACT.detective.classList.add('hop'); confetti(120);
        await c.say('s9_w');
      },
    });
  });
}

/* --- final: three challenges and the treasure --- */
const QUIZ = [
  {line:'f_q1', q:'ما أفضل مشروب لإرواء العطش؟', opts:[{p:['water'], t:'الماء', ok:1},{p:['sodabottle'], t:'المشروب الغازي'},{p:['juice'], t:'العصير المحلّى'}]},
  {line:'f_q2', q:'أي مجموعة تصلح لوجبة متنوعة؟', opts:[{p:['rice','fish','salad'], t:'أرز وسمك وخضراوات', ok:1},{p:['candy','soda','chips'], t:'حلوى ومشروب غازي ورقائق'},{p:['fries','burger','sodabottle'], t:'بطاطا مقلية وبرجر ومشروب غازي'}]},
  {line:'f_q3', q:'سالم يتناول الحلوى العُمانية بكثرة كل يوم. بماذا تنصحه؟', opts:[{p:['halwa','fruitveg'], t:'يقلّل منها وينوّع غذاءه', ok:1},{p:['halwa','halwa'], t:'يأكل منها أكثر'},{p:['chips'], t:'يتركها ويأكل رقائق البطاطس'}]},
];
const ENDING = [['saeed','e_saeed'],['nakhla','e_nakhla'],['reem','e_reem'],['redhood','e_redhood'],['maha','e_maha'],['fahd','e_fahd'],['grandpa','e_grandpa'],['boy','e_boy']];
function finale(){
  scene(async c => {
    mark('finale', finale);
    preload(['f_1','f_q1','f_q2','f_q3','f_x','f_key', ...ENDING.map(e=>e[1]), 'e_msg']);
    setBg('bg_treasure');
    const chest = prop('chest_closed', {x:800, y:640, w:380});
    const stars = [];
    for (let i=0;i<N_STARS;i++){ const r = rectOf(hud.children[i]); const s = prop('star', {x:r.x + r.w/2, y:r.y + r.h/2, w:50, cls:'glowing'}); stars.push(s);
      later(() => { const a = Math.PI*(i/(N_STARS-1)); movePropTo(s, 800 + Math.cos(a)*330, 400 - Math.sin(a)*180, 92); }, 200 + i*110); }
    sfx.sparkle(); await c.sleep(1300);
    chest.classList.add('shake'); sfx.thud();
    await c.say('f_1');
    stars.forEach(s => { s.style.opacity = .35; });
    for (const Q of QUIZ){
      const k = card('التحدي ' + ['الأول','الثاني','الثالث'][QUIZ.indexOf(Q)], Q.q);
      const box = el('div', 'opts');
      await c.wait(new Promise(res => {
        shuffle(Q.opts).forEach(o => { const b = el('button', 'opt'); b.type = 'button';
          b.innerHTML = `<div class="pics ${o.p.length > 2 ? 'three' : ''}">${o.p.map(n => `<img src="${IMG.i(n)}" alt="">`).join('')}</div><div class="ot">${o.t}</div>`;
          b.addEventListener('click', () => { ac(); if (o.ok){ b.classList.add('right'); sfx.ding(); praise(); confetti(60); later(res, 1400); } else { sfx.buzz(); b.classList.add('no'); later(()=>b.classList.remove('no'),460); sayNow('f_x'); } });
          box.appendChild(b); });
        sceneEl.appendChild(box);
        say(Q.line);
      }));
      box.remove(); k.remove();
    }
    stars.forEach(s => { s.style.opacity = 1; movePropTo(s, 800, 330, 60); });
    sfx.sparkle(); await c.sleep(900); stars.forEach(s => s.remove()); flash();
    const key = prop('key', {x:800, y:330, w:10, cls:'glowing float'}); key.style.pointerEvents = 'auto'; key.style.cursor = 'pointer'; await c.sleep(30); key.style.width = '170px';
    await c.say('f_key');
    await c.wait(new Promise(r => key.addEventListener('pointerdown', () => { ac(); r(); }, {once:true})));
    key.classList.remove('float'); movePropTo(key, 800, 620, 80); await c.sleep(800); key.remove();
    chest.src = IMG.i('chest_open'); chest.style.width = '380px'; flash(); sfx.fanfare(); confetti(220);
    chest.style.zIndex = 8;
    const spots = [[130,0],[290,0],[450,0],[1170,0],[1320,0],[1475,0],[1020,0],[590,0]];
    const H = {saeed:380, nakhla:400, reem:380, redhood:340, maha:360, fahd:370, grandpa:400, boy:340};
    ENDING.forEach(([n],i) => later(() => actor(n, {x:spots[i][0], bottom:40, h:H[n], enter:'fade'}), i*150));
    await c.sleep(1600);
    for (const [n,l] of ENDING){ ACT[n].classList.add('glow'); await c.say(l); ACT[n].classList.remove('glow'); }
    hideCaption();
    const bn = el('div', 'banner pop', `<h2>صحتي كنزي، وغذائي سر نشاطي</h2><p>من خيرات عُمان نختار غذاءنا، وبالغذاء المتوازن نحافظ على صحتنا</p>`);
    sceneEl.appendChild(bn); confetti(200); sfx.fanfare();
    await c.say('e_msg', {caption:false});
    await c.cta('العودة إلى البداية');
    STARS.clear(); DONE.clear(); drawHud(); cover();
  });
}

Object.keys(STATION_FN).forEach(k => { STATIONS[k] = (p) => { NEXT_PHASE = p === 'game' ? 'game' : 'teaser'; STATION_FN[k](); }; });

document.getElementById('b-home').addEventListener('click', () => { ac(); map(); });
document.getElementById('b-back').addEventListener('click', () => { ac(); sfx.page(); goBack(); });
document.getElementById('b-skip').addEventListener('click', () => {
  ac();
  if (curVideo){ curVideo.currentTime = curVideo.duration || 9999; return; }
  const b = sceneEl.querySelector('.cta'); if (b){ b.click(); return; }
  stopAudio();
});
document.getElementById('b-again').addEventListener('click', () => { ac(); if (lastLine) say(lastLine); });
document.getElementById('b-mute').addEventListener('click', e => { muted = !muted; e.currentTarget.classList.toggle('off', muted); if (curAudio) curAudio.muted = muted; if (curVideo) curVideo.muted = muted; });
document.getElementById('b-full').addEventListener('click', () => { ac(); const d = document; try { if (!d.fullscreenElement) (viewport.requestFullscreen || viewport.webkitRequestFullscreen).call(viewport).catch(()=>{}); else d.exitFullscreen(); } catch(e){} later(fit, 300); });
document.addEventListener('fullscreenchange', () => setTimeout(fit, 120));
addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === ' ' ) { const b = sceneEl.querySelector('.cta'); if (b){ e.preventDefault(); b.click(); } } });

cover();
